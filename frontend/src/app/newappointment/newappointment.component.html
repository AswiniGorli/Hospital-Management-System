
<form *ngIf="formgroup" [formGroup]="formgroup" (ngSubmit)="newdoctor()">
    <h1>Book Appointment</h1>

    <input type="text" placeholder="Enter name" formControlName="name"><br>
    <input type="text" placeholder="Enter gender" formControlName="gender"><br>
    <input type="number" placeholder="Enter doctorid" formControlName="doctorid"><br>
    <input type="date" placeholder="Enter date" formControlName="date"><br>
    <input type="number" placeholder="Enter phone number" formControlName="phoneno"><br>
    <input type="text" placeholder="Enter problem" formControlName="problem"><br>

    <button type="submit" [disabled]="formgroup.invalid">Submit</button>

</form>
